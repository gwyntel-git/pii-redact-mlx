[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redact-mlx"
version = "0.2.0"
description = "A tool for redacting PII information from text using LLMs, with an MLX (oMLX) backend for Apple Silicon"
readme = "README.md"
authors = [
    {name = "Andie Jones", email = "andie@openpipe.ai"},
]
requires-python = ">=3.7"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core deps cover the oMLX/MLX backend, which needs no torch or GPU.
dependencies = [
    "tqdm>=4.61.0",
    "faker>=8.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# Original local torch/transformers inference path.
transformers = [
    "torch>=1.10.0",
    "transformers>=4.26.0",
]
# Everything (torch path + MLX server path).
all = [
    "torch>=1.10.0",
    "transformers>=4.26.0",
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/OpenPipe/pii-redaction"
Source = "https://github.com/OpenPipe/pii-redaction"

[project.scripts]
pii-redact = "pii_redaction.cli:main"
